services:
  advcrm-bot:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      FAIL_CLOSED: "true"
      CONFIDENCE_HIGH_THRESHOLD: "0.80"
      CONFIDENCE_MEDIUM_THRESHOLD: "0.60"
      MAX_AUTOMATED_QUESTIONS: "5"
      TAXONOMY_VERSION: legal_subjects.v1
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
